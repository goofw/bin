name: openssh

on:
  workflow_dispatch:
  schedule:
    - cron: "44 4 * * 4"

permissions:
  contents: write
  id-token: write

concurrency:
  group: "openssh"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - run: |
          docker run --rm -v $(pwd):/mnt -w /mnt alpine sh openssh.sh
